<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KT #1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 50px;
        background-color: #033a1c;
        color: #ffffff;
        font-family: "Roboto", sans-serif;
      }

      table {
        width: 650px;
        border-collapse: collapse;
        text-align: center;
      }

      td {
        border: 1px solid #ff9500;
        padding: 14px;
        vertical-align: top;
        line-height: 1.2;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #ff9500;
        color: #033a1c;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      button:hover {
        background-color: #e68900;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </table>

    <button onclick="btn()">Заполнить таблицу</button>

    <script>
      let isTableFilled = false;

      function generateNum() {
        return Math.floor(Math.random() * 100);
      }

      function fillTable() {
        const table = document.querySelector("table");

        for (let i = 0; i < 5; i++) {
          const row = table.rows[i];
          for (let j = 0; j < 6; j++) {
            const cell = row.cells[j];
            const randomNumber = generateNum();
            cell.textContent = randomNumber;

            if (randomNumber >= 50) {
              cell.style.backgroundColor = "#ff9500";
            } else {
              cell.style.backgroundColor = "";
            }
          }
        }
        isTableFilled = true;
      }

      function updateRandomCell() {
        const table = document.querySelector("table");
        const randomRow = Math.floor(Math.random() * 5);
        const randomCell = Math.floor(Math.random() * 6);

        const cell = table.rows[randomRow].cells[randomCell];
        const randomNumber = generateNum();
        cell.textContent = randomNumber;

        if (randomNumber >= 50) {
          cell.style.backgroundColor = "#ff9500";
        } else {
          cell.style.backgroundColor = "";
        }
      }

      function btn() {
        if (!isTableFilled) {
          fillTable();
        } else {
          updateRandomCell();
        }
      }
    </script>
  </body>
</html>
